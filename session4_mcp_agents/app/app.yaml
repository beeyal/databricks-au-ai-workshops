command: ["python", "server.py"]

env:
  # The agent LLM. It must (a) stay in-region for AU East residency and (b) do
  # reliable tool/function calling. Per the Databricks region docs, in australiaeast
  # GPT-OSS is in-region (no cross-geo routing) both pay-per-token AND provisioned
  # throughput — and it tool-called cleanly across all labs — so it is the
  # recommended backend. Point au_east_llm_inregion at GPT-OSS-120B (PT), or set
  # PT_ENDPOINT directly to the shared endpoint below.
  #   RECOMMENDED (in-region + reliable tool calls): databricks-gpt-oss-120b
  #   AVOID for AU East: Llama family — marked cross-geo (⥂) in the region table,
  #     so it breaks residency, and it emitted malformed tool calls in testing.
  #   Claude models are in-region too, but databricks-langchain currently sends a
  #     tool_result block with an extra `id` field that the Anthropic-format
  #     endpoint rejects ("tool_result...id: Extra inputs are not permitted"),
  #     so prefer GPT-OSS until that is resolved / databricks-langchain is upgraded.
  # See: https://learn.microsoft.com/en-us/azure/databricks/resources/feature-region-support
  - name: PT_ENDPOINT
    value: au_east_llm_inregion
  - name: CATALOG
    value: workshop_au
  - name: SCHEMA_AEMO
    value: aemo
  - name: VS_ENDPOINT
    value: workshop_vs
  # Vector Search index (3-part name). Uncomment/adjust if your index name
  # differs from the default {CATALOG}.{SCHEMA_AEMO}.aemo_market_notices_index.
  # - name: VS_INDEX
  #   value: workshop_au.aemo.aemo_market_notices_index
  # GENIE_SPACE_ID: set this via the UI Environment tab after deployment,
  # or uncomment the lines below and fill in your Space ID. Leave empty to
  # run with UC Functions + Vector Search only.
  # - name: GENIE_SPACE_ID
  #   value: FILL_IN

resources:
  - name: aemo-pt-endpoint
    description: In-region (Australia East) provisioned-throughput endpoint for the AEMO agent LLM calls
    serving_endpoint:
      name: au_east_llm_inregion
      permission: CAN_QUERY
